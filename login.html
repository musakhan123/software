<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Ride Sharing System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="auth-logo">🚗 Ride Sharing System</div>
    <div class="auth-card">
        <h2>Welcome Back</h2>

        <form class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-primary auth-submit">Sign In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
</body>

</html>
