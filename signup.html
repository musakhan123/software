<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Ride Sharing System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="auth-logo"><img src="logo.svg" alt="Ride Sharing System"></div>
    <div class="auth-card">
        <h2>Create an account</h2>
        <p class="subtitle">Signup to start booking or to offer rides</p>

        <form class="auth-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="03XX-XXXXXXX">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters">
            </div>

            <div class="form-group">
                <label>I am a</label>
                <div class="role-selector">
                    <div id="passenger-card" class="role-option" onclick="selectRole('passenger')">
                        <div class="role-icon">👤</div>
                        <p>Passenger</p>
                    </div>
                    <div id="driver-card" class="role-option" onclick="selectRole('driver')">
                        <div class="role-icon">🚗</div>
                        <p>Driver</p>
                    </div>
                </div>
            </div>

            <p class="form-error" id="form-error" style="display: none; color: #ef4444; font-size: 13px;"></p>

            <button type="submit" class="btn-primary auth-submit">Create an account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>
    </div>

    <script src="signup.js"></script>
</body>

</html>
