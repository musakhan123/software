<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><img src="logo.svg" alt="Ride Sharing System"></div>
            <nav class="sidebar-nav">
                <a href="admin.html">Dashboard</a>
                <a href="users.html" class="active">Users</a>
                <a href="drivers.html">Drivers</a>
                <a href="rides.html">Rides</a>

            </nav>
        </aside>

        <main class="admin-main">
            <h1>Manage Users</h1>

            <div class="panel">
                <h2>All Users</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Joined</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Sara Ahmed</td>
                            <td>sara@example.com</td>
                            <td>Jan 2026</td>
                            <td><span class="status approved">Active</span></td>
                            <td><button class="btn-reject">Suspend</button></td>
                        </tr>
                        <tr>
                            <td>Usman Tariq</td>
                            <td>usman@example.com</td>
                            <td>Feb 2026</td>
                            <td><span class="status approved">Active</span></td>
                            <td><button class="btn-reject">Suspend</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
