<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><img src="logo.svg" alt="Ride Sharing System"></div>
            <nav class="sidebar-nav">
                <a href="admin.html">Dashboard</a>
                <a href="users.html">Users</a>
                <a href="drivers.html">Drivers</a>
                <a href="rides.html">Rides</a>
                <a href="reviews.html" class="active">Reviews</a>
            </nav>
        </aside>

        <main class="admin-main">
            <h1>Reviews & Reports</h1>

            <div class="panel">
                <h2>Recent Reviews</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Passenger</th>
                            <th>Driver</th>
                            <th>Rating</th>
                            <th>Comment</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Sara Ahmed</td>
                            <td>Ahmad Khan</td>
                            <td>⭐⭐⭐⭐⭐</td>
                            <td>Great ride, very punctual.</td>
                            <td><button class="btn-reject">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
