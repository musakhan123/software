<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ride Sharing System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="auth-logo">🚗 Ride Sharing System</div>
    <div class="auth-card">
        <h2>Admin Login</h2>

        <form class="auth-form">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-primary auth-submit">Sign In</button>
        </form>
        <p class="auth-footer">Not an admin? <a href="login.html">Go to user login</a></p>
    </div>
</body>

</html>
