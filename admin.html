<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">🚗 Admin Panel</div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="active">Dashboard</a>
                <a href="users.html">Users</a>
                <a href="drivers.html">Drivers</a>
                <a href="rides.html">Rides</a>
                <a href="reviews.html">Reviews</a>
            </nav>
        </aside>

        <main class="admin-main">
            <h1>Manage the platform, Admin.</h1>

            <div class="stats-row">
                <div class="stat-card">
                    <p class="stat-label">TOTAL USERS</p>
                    <p class="stat-number blue">128</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">TOTAL DRIVERS</p>
                    <p class="stat-number green">34</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">ACTIVE RIDES</p>
                    <p class="stat-number blue">6</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">REVENUE (PKR)</p>
                    <p class="stat-number green">42,000</p>
                </div>
            </div>

            <div class="panel">
                <h2>Pending Driver Approvals</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Driver</th>
                            <th>Vehicle</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Ahmad Khan</td>
                            <td>Suzuki Cultus</td>
                            <td><span class="status pending">Pending</span></td>
                            <td>
                                <button class="btn-approve">Approve</button>
                                <button class="btn-reject">Reject</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Bilal Raza</td>
                            <td>Toyota Corolla</td>
                            <td><span class="status pending">Pending</span></td>
                            <td>
                                <button class="btn-approve">Approve</button>
                                <button class="btn-reject">Reject</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
